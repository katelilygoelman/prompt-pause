<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; width: 250px; padding: 14px; margin: 0; color: #1f1f1f; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    label { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 10px; }
    input[type=number] { width: 48px; font: inherit; }
    hr { border: none; border-top: 1px solid #ddd; margin: 12px 0; }
    #site { font-weight: 600; word-break: break-all; }
    #status { color: #555; font-size: 12px; margin: 4px 0 8px; }
    button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #bbb; background: #f4f4f4; cursor: pointer; width: 100%; }
    button:hover { background: #e8e8e8; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Prompt Pause</h1>

  <label><input type="checkbox" id="enabled"> Require a mouse click to send</label>
  <label>Pause before Send unlocks: <input type="number" id="delay" min="0" max="30" step="1"> sec</label>

  <hr>

  <div id="site"></div>
  <div id="status"></div>
  <button id="toggleSite" hidden></button>

  <script src="popup.js"></script>
</body>
</html>
